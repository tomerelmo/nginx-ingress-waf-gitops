apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # In Dev Mode, Vault's root token is simply "root"
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets

