piVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: regkey
  namespace: nginx-ingress
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: regkey # NGINX uses this secret name to pull images from private-registry.nginx.com
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"private-registry.nginx.com":{"username":"{{ .license_jwt }}","password":"none"}}}'
  data:
    - secretKey: license_jwt
      remoteRef:
        key: nginx-license
        property: license-jwt

