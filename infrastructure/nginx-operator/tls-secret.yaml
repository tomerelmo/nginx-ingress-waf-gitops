apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: client-tls-secret
  namespace: nginx-ingress
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: client-tls-secret # NGINX Ingress will consume this for HTTPS termination
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: client-tls
        property: tls-crt
    - secretKey: tls.key
      remoteRef:
        key: client-tls
        property: tls-key

