capiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: openshift-gitops
spec:
  project: default
  source:
    chart: vault
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.28.0
    helm:
      parameters:
        - name: "server.dev.enabled"
          value: "true"
        - name: "server.route.enabled"
          value: "true"
        - name: "injector.enabled"
          value: "false" # Disables the vault-agent-injector completely
        - name: "server.image.repository"
          value: "docker.io/hashicorp/vault"
        - name: "server.image.tag"
          value: "1.15.2"
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

