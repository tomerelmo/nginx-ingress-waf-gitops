apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: openshift-gitops
spec:
  project: default
  source:
    chart: vault
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.28.0
    helm:
      parameters:
        - name: "server.dev.enabled"
          value: "true" # Dev mode is ideal for local/lab environments as it auto-unseals!
        - name: "server.route.enabled"
          value: "true" # Automatically exposes Vault's UI on OpenShift via an OCP Route!
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

