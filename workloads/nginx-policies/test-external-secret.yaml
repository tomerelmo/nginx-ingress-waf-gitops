apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-first-synced-secret
  namespace: default
spec:
  refreshInterval: "15s" # How often ESO checks Vault for drift
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ocp-native-secret # This is the name of the Kubernetes Secret that will be CREATED
    creationPolicy: Owner
  data:
    - secretKey: my-synced-value # The key name inside the K8s secret
      remoteRef:
        key: test-enterprise # Vault path
        property: my-key # Vault key

